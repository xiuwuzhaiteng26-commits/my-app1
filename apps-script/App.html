<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <style>
      /*
        アメリカンバイクのモチーフ。
        ガレージの暗さ（マットブラック〜ガンメタル）に、
        タンクのオレンジとメッキのクローム、計器の琥珀色を乗せている。
        端末のライト/ダーク設定にかかわらず、この一枚の見た目で通す。
      */
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --bg-2: #121317;
        --card: #17181c;
        --card-2: #1e2026;
        --line: #2c2f36;
        --line-soft: #232529;
        --text: #f1ece4;
        --muted: #9a958c;
        --faint: #6f6a63;

        /* タンクのオレンジ */
        --accent: #f0821e;
        --accent-2: #c2410c;
        --accent-soft: #2a1c10;
        /* メッキ */
        --chrome-1: #f6f7f8;
        --chrome-2: #b9bec6;
        --chrome-3: #7d838c;
        --chrome-4: #4a4f57;

        --ok: #7fd18f;
        --warn: #f5b13c;
        --alert: #f2695e;
        --ok-bg: #16241a;
        --warn-bg: #2b2113;
        --alert-bg: #2c1917;
        --ok-bar: #4caf6a;
        --warn-bar: #e79a2a;
        --alert-bar: #e2503f;

        --shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 6px 18px rgba(0, 0, 0, .45);
        --shadow-lg: 0 2px 8px rgba(0, 0, 0, .6), 0 18px 44px rgba(0, 0, 0, .6);
        --radius: 16px;
        --chrome: linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-2) 42%, var(--chrome-4) 52%, var(--chrome-3) 68%, var(--chrome-1) 100%);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        padding: 0 0 calc(76px + env(safe-area-inset-bottom));
        background:
          radial-gradient(1100px 520px at 50% -180px, #1d1f25 0%, transparent 70%),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans',
          'Noto Sans JP', 'Yu Gothic', sans-serif;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
      }

      /* ---------- ヘッダー ---------- */
      header {
        position: sticky; top: 0; z-index: 30;
        background: linear-gradient(180deg, rgba(24,25,29,.96) 0%, rgba(16,17,20,.92) 100%);
        backdrop-filter: saturate(1.4) blur(14px);
        -webkit-backdrop-filter: saturate(1.4) blur(14px);
        border-bottom: 1px solid #000;
        box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 6px 18px rgba(0,0,0,.5);
        padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
        display: flex; align-items: center; gap: 12px;
      }
      /* タンクのピンストライプ */
      header::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent) 18%, var(--chrome-2) 50%, var(--accent) 82%, transparent);
        opacity: .75;
      }
      header .brand { flex: 1; min-width: 0; }
      header h1 {
        font-size: 15px; margin: 0; font-weight: 800;
        letter-spacing: .16em; text-transform: uppercase;
        background: var(--chrome); -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
      }
      header h1 .jp {
        display: block; font-size: 11px; letter-spacing: .06em; font-weight: 600;
        text-transform: none; color: var(--muted);
        -webkit-text-fill-color: var(--muted);
      }
      header .updated {
        display: flex; align-items: center; gap: 5px;
        font-size: 11px; color: var(--faint); font-weight: 400; margin-top: 1px;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; background: var(--ok-bar); }
      .dot.注意 { background: var(--warn-bar); }
      .dot.警告 { background: var(--alert-bar); }
      .spin {
        width: 12px; height: 12px; flex: 0 0 auto;
        border: 2px solid var(--line); border-top-color: var(--accent);
        border-radius: 50%; animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .icon-btn {
        border: 1px solid var(--chrome-4); color: var(--chrome-1);
        background: linear-gradient(180deg, #33363d, #1c1e22);
        border-radius: 999px; padding: 7px 15px; font-size: 12.5px; font-weight: 700;
        letter-spacing: .04em; cursor: pointer; flex: 0 0 auto; font-family: inherit;
        box-shadow: 0 1px 0 rgba(255,255,255,.14) inset;
      }
      .icon-btn:active { transform: scale(.96); }
      /* エンジン音の入切。かかっているときはオレンジに光らせる */
      .engine-btn {
        padding: 7px 11px; font-size: 11.5px;
        color: var(--accent); border-color: rgba(240,130,30,.45);
        text-shadow: 0 0 10px rgba(240,130,30,.5);
      }
      .engine-btn.off { color: var(--faint); border-color: var(--line); text-shadow: none; }

      main { padding: 14px 14px 0; max-width: 620px; margin: 0 auto; }
      .view { display: none; animation: fade .22s ease; }
      .view.active { display: block; }
      @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

      /* ---------- カード ---------- */
      .card {
        background: linear-gradient(180deg, var(--card-2) 0%, var(--card) 100%);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: var(--shadow), 0 1px 0 rgba(255,255,255,.05) inset;
      }
      /* 見出しは小さなクロームの銘板ふうに */
      .card > h2 {
        font-size: 10.5px; color: var(--muted); margin: 0 0 12px;
        font-weight: 800; letter-spacing: .14em;
        display: flex; align-items: center; gap: 9px;
      }
      .card > h2::after {
        content: ''; flex: 1; height: 1px;
        background: linear-gradient(90deg, var(--line), transparent);
      }
      .card h3 { font-size: 15px; margin: 0; font-weight: 650; }

      /* ---------- ヒーロー ---------- */
      /* 燃料タンクを思わせるカード。上に光沢、縁にクロームのライン */
      .hero {
        position: relative; overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% -30%, rgba(255,255,255,.22) 0%, transparent 58%),
          linear-gradient(165deg, var(--accent) 0%, var(--accent-2) 68%, #7c2a08 100%);
        color: #fff2e4;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 22px; padding: 20px 18px;
        margin-bottom: 12px; box-shadow: var(--shadow-lg);
      }
      .hero::after {
        content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px;
        background: var(--chrome); opacity: .55; border-radius: 2px;
      }
      .hero .label { font-size: 12px; opacity: .82; font-weight: 600; letter-spacing: .04em; }
      .hero .amount { font-size: 34px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; margin-top: 2px; }
      .hero .sub { font-size: 12px; opacity: .82; margin-top: 3px; }
      .hero .split { margin-top: 16px; }
      .split { display: flex; gap: 9px; }
      .split .chip {
        flex: 1; min-width: 0; padding: 10px 11px; border-radius: 11px;
        background: #101116; border: 1px solid var(--line);
      }
      .split .chip .k { font-size: 10.5px; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .split .chip .v { font-size: 15px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
      .hero .chip {
        flex: 1; background: rgba(0,0,0,.24); border: 1px solid rgba(255,255,255,.14);
        border-radius: 12px; padding: 9px 11px; min-width: 0;
      }
      .hero .chip .k { font-size: 10.5px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hero .chip .v { font-size: 15px; font-weight: 700; margin-top: 1px; }

      /* ---------- 数値・行 ---------- */
      .big { font-size: 27px; font-weight: 750; letter-spacing: -.022em; line-height: 1.2; }
      .big.neg { color: var(--alert); }
      .sub { font-size: 12px; color: var(--muted); }
      .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .row + .row { margin-top: 7px; }
      .row .k { color: var(--muted); font-size: 13px; }
      .row .v { font-variant-numeric: tabular-nums; font-size: 14px; }
      .strong { font-weight: 750; }
      .divider { border-top: 1px solid var(--line-soft); margin: 11px 0; }
      .total { background: var(--accent-soft); margin: 11px -16px -16px; padding: 13px 16px;
               border-radius: 0 0 var(--radius) var(--radius); }
      .total .k { color: var(--text); font-weight: 650; font-size: 13px; }
      .total .v { font-size: 16px; }

      /* ---------- バッジ ---------- */
      .badge {
        display: inline-block; font-size: 11px; font-weight: 750;
        padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      }
      .s-正常 { color: var(--ok); background: var(--ok-bg); }
      .s-注意 { color: var(--warn); background: var(--warn-bg); }
      .s-警告, .s-要確認 { color: var(--alert); background: var(--alert-bg); }
      .s-OK { color: var(--ok); background: var(--ok-bg); }
      .s-情報, .s-INFO { color: var(--muted); background: var(--line-soft); }

      /* ---------- バー ---------- */
      /* 計器の目盛りを敷いた進捗バー（タコメーターのイメージ） */
      .bar {
        position: relative; height: 11px; border-radius: 3px; overflow: hidden;
        margin: 11px 0 7px;
        background: #0a0a0c;
        border: 1px solid #000;
        box-shadow: 0 1px 0 rgba(255,255,255,.06), inset 0 2px 5px rgba(0,0,0,.9);
      }
      .bar::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 1px, transparent 1px 10%);
      }
      .bar > i {
        display: block; height: 100%; border-radius: 2px;
        transition: width .6s cubic-bezier(.2,.8,.2,1);
        box-shadow: 0 0 10px currentColor;
      }
      .f-正常 { color: var(--ok-bar); background: linear-gradient(90deg, #2f7a45, var(--ok-bar)); }
      .f-注意 { color: var(--warn-bar); background: linear-gradient(90deg, #a86a12, var(--warn-bar)); }
      .f-警告 { color: var(--alert-bar); background: linear-gradient(90deg, #97281c, var(--alert-bar)); }

      /* ---------- 壁カード ---------- */
      .wall + .wall { margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
      .wall .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .wall .name { font-size: 14px; font-weight: 700; }
      .wall .rest {
        font-size: 25px; font-weight: 800; letter-spacing: -.02em; margin-top: 5px;
        font-variant-numeric: tabular-nums;
      }
      .wall .rest.neg { color: var(--alert); }
      .wall .meta { display: flex; justify-content: space-between; }

      /* ---------- 月ごとの見出し ---------- */
      .month-head {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 12px; margin-bottom: 12px; border-radius: 8px;
        background: linear-gradient(180deg, #2b2e35, #1b1d21);
        border: 1px solid var(--line);
        box-shadow: 0 1px 0 rgba(255,255,255,.07) inset;
      }
      .month-head .month-name {
        font-size: 14px; font-weight: 800; letter-spacing: .04em;
        background: var(--chrome); -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
      }
      .month-head .sub { flex: 1; }
      .month-row + .month-row { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line-soft); }

      /* ---------- 一覧 ---------- */
      ul.list { list-style: none; margin: 0; padding: 0; }
      ul.list li { padding: 11px 0; border-top: 1px solid var(--line-soft); }
      ul.list li:first-child { border-top: 0; padding-top: 2px; }
      .empty { color: var(--faint); font-size: 13px; padding: 10px 0; text-align: center; }
      .block + .block { margin-top: 17px; padding-top: 16px; border-top: 1px solid var(--line-soft); }

      /* ---------- アドバイス ---------- */
      .advice { display: flex; gap: 11px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line-soft); }
      .advice:first-child { border-top: 0; padding-top: 0; }
      .advice .badge { flex: 0 0 auto; margin-top: 1px; }
      .advice div { font-size: 13.5px; line-height: 1.6; }

      /* ---------- フォーム ---------- */
      label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 5px; font-weight: 600; }
      input, select, textarea {
        width: 100%; padding: 11px 13px; font-size: 16px; color: var(--text);
        background: #0d0e11; border: 1px solid var(--line); border-radius: 10px;
        font-family: inherit; appearance: none;
      }
      input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
      }
      select { background-image: none; }
      button.primary {
        width: 100%; margin-top: 16px; padding: 13px; font-size: 15px; font-weight: 800;
        letter-spacing: .06em;
        border: 1px solid rgba(255,255,255,.16); border-radius: 10px;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        color: #fff6ee; cursor: pointer; font-family: inherit;
        box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 6px 16px rgba(0,0,0,.5);
      }
      button.primary:active { transform: scale(.99); }
      button.primary:disabled { opacity: .5; }
      button.small {
        padding: 9px 14px; font-size: 13px; font-weight: 650; border-radius: 10px;
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        cursor: pointer; font-family: inherit; flex: 0 0 auto;
      }
      .inline { display: flex; gap: 9px; align-items: center; }
      .inline input, .inline select { flex: 1; min-width: 0; }
      .check { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: 13px; color: var(--muted); }
      .check input { width: 19px; height: 19px; flex: 0 0 auto; accent-color: var(--accent); }
      a { color: var(--accent); text-decoration: none; font-weight: 600; }

      .estimate {
        background: var(--accent-soft); border: 1px solid rgba(240,130,30,.28);
        border-radius: 11px; padding: 13px 15px; margin-top: 14px;
      }
      .estimate .k { font-size: 11.5px; color: var(--muted); font-weight: 600; }
      .estimate .v { font-size: 25px; font-weight: 780; letter-spacing: -.02em; margin-top: 1px; }

      /* ---------- スピードメーター ---------- */
      .gauge { margin-bottom: 12px; }
      /* メッキのベゼルに囲まれた黒い文字盤 */
      .gauge-face {
        position: relative;
        border-radius: 22px;
        padding: 16px 14px 14px;
        background:
          radial-gradient(115% 85% at 50% 6%, #23252c 0%, #101116 62%, #08090b 100%);
        border: 1px solid #000;
        box-shadow:
          0 0 0 3px var(--chrome-4),
          0 0 0 4px var(--chrome-2),
          0 0 0 6px #16171b,
          var(--shadow-lg),
          inset 0 2px 10px rgba(255, 255, 255, .07);
      }
      .gauge-face svg { display: block; width: 100%; height: auto; overflow: visible; }

      /* 目盛りの帯 */
      .g-band { fill: none; stroke-width: 5; stroke-linecap: butt; opacity: .5; }
      .g-ok { stroke: var(--ok-bar); }
      .g-warn { stroke: var(--warn-bar); }
      .g-alert { stroke: var(--alert-bar); }

      /* 目盛り。オレンジに淡く光らせる */
      .g-tick { stroke: var(--accent); stroke-width: 1.6; opacity: .55; }
      .g-major { stroke-width: 3.2; opacity: 1; }
      .g-num {
        fill: var(--accent); font-size: 19px; font-weight: 800;
        text-anchor: middle; dominant-baseline: middle;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }
      .g-unit {
        fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .18em;
        text-anchor: middle; dominant-baseline: middle;
      }
      /* 壁の位置に立てる印 */
      .g-wall { stroke: var(--alert); stroke-width: 2.4; opacity: .9; }

      /* 針 */
      .g-needle {
        stroke: #fff3e2; stroke-width: 5; stroke-linecap: round;
        filter: drop-shadow(0 0 7px rgba(255, 190, 120, .75));
      }
      /* 起動時に0から現在値まで振れる（実車の針の動きに合わせている） */
      .g-needle-wrap {
        transform-origin: 160px 168px;
        animation: sweep 1s cubic-bezier(.18, .9, .25, 1) both;
      }
      @keyframes sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(var(--to)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .g-needle-wrap { animation: none; transform: rotate(var(--to)); }
      }
      .g-hub { fill: var(--chrome-3); stroke: #0a0a0c; stroke-width: 1.5; }
      .g-hub2 { fill: #17181c; }

      /* 計器の警告灯 */
      .gauge-face .lamps {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: 62px; display: flex; gap: 42px;
      }
      .lamps .lamp {
        width: 9px; height: 9px; border-radius: 50%;
        background: #2a2b30; box-shadow: inset 0 1px 2px rgba(0,0,0,.8);
      }
      .lamps .lamp.on { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
      .lamps .lamp.on.alert { background: var(--alert); box-shadow: 0 0 10px var(--alert); }

      /* 走行距離計ふうの液晶 */
      .odo {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        margin: 4px auto 0; width: fit-content; max-width: 100%;
        padding: 6px 14px; border-radius: 5px;
        background: #1a1305;
        border: 1px solid #000;
        box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06);
      }
      .odo-k { font-size: 10px; color: #a4711d; font-weight: 700; letter-spacing: .12em; }
      .odo-v {
        font-size: 20px; font-weight: 800; letter-spacing: .06em;
        color: #ffb03a; text-shadow: 0 0 9px rgba(255, 150, 30, .6);
        font-variant-numeric: tabular-nums;
        font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      }
      .gauge-note { text-align: center; font-size: 13px; color: var(--muted); margin-top: 11px; }
      .gauge-note b { color: var(--text); font-size: 15px; }

      /* ---------- 起動画面（イグニッション） ---------- */
      #ignition {
        position: fixed; inset: 0; z-index: 90;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; padding: 32px;
        background:
          radial-gradient(720px 460px at 50% 38%, #1e2027 0%, #0a0a0c 68%),
          #08080a;
        transition: opacity .55s ease, visibility .55s;
      }
      #ignition.gone { opacity: 0; visibility: hidden; pointer-events: none; }

      #ignition .mark {
        text-align: center;
        font-weight: 900; letter-spacing: .3em; font-size: 13px; text-transform: uppercase;
        background: var(--chrome); -webkit-background-clip: text; background-clip: text;
        color: transparent; -webkit-text-fill-color: transparent;
      }
      #ignition .mark small {
        display: block; margin-top: 8px;
        font-size: 19px; letter-spacing: .1em; font-weight: 800;
        -webkit-text-fill-color: transparent;
      }
      #ignition .mark .jp {
        display: block; margin-top: 10px; font-size: 12px; letter-spacing: .08em;
        font-weight: 600; color: var(--muted); -webkit-text-fill-color: var(--muted);
        text-transform: none;
      }

      /* セルスターターのボタン */
      #starter {
        position: relative; width: 172px; height: 172px; border-radius: 50%;
        border: 0; padding: 0; cursor: pointer; font-family: inherit;
        background: var(--chrome);
        box-shadow: 0 18px 40px rgba(0,0,0,.7), 0 0 0 1px #000;
        display: grid; place-items: center;
        transition: transform .12s ease;
      }
      #starter::before {
        content: ''; position: absolute; inset: 9px; border-radius: 50%;
        background: radial-gradient(circle at 50% 32%, #3a3d45 0%, #17181c 62%, #0c0d10 100%);
        box-shadow: inset 0 2px 6px rgba(255,255,255,.14), inset 0 -8px 18px rgba(0,0,0,.85);
      }
      #starter .face {
        position: relative; text-align: center; line-height: 1.25;
        color: var(--accent); text-shadow: 0 0 16px rgba(240,130,30,.5);
      }
      #starter .face .en { display: block; font-size: 25px; font-weight: 900; letter-spacing: .16em; }
      #starter .face .jp { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .1em; margin-top: 4px; text-shadow: none; }
      #starter:active { transform: scale(.96); }
      #starter.cranking { animation: shake .09s linear infinite; }
      #starter.cranking .face .en { animation: flicker .12s linear infinite; }
      @keyframes shake {
        0% { transform: translate(0, 0); }
        25% { transform: translate(1px, -1px); }
        50% { transform: translate(-1px, 1px); }
        75% { transform: translate(-1px, -1px); }
        100% { transform: translate(1px, 1px); }
      }
      @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

      #ignition .hint { font-size: 12px; color: var(--faint); text-align: center; max-width: 300px; line-height: 1.7; }
      #ignition .mute {
        border: 1px solid var(--chrome-4); color: var(--chrome-2); background: transparent;
        border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 700;
        cursor: pointer; font-family: inherit;
      }
      @media (prefers-reduced-motion: reduce) {

      /* ---------- ナビ ---------- */
      nav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;

        background: linear-gradient(180deg, rgba(26,27,32,.96), rgba(12,13,16,.98));

      nav button.active .ico { filter: none; opacity: 1; transform: translateY(-1px); }

      /* ---------- 通知など ---------- */

        padding: 16px 6px 24px; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="ignition">
      <div class="mark">
        Income Wall
        <small>Garage Ledger</small>

      <button id="starter" type="button" aria-label="エンジンを始動してアプリを開く">

      <div class="hint" id="ignition-hint">ボタンを押すとエンジン音が鳴ります。<br />音を出したくないときは下から消せます。</div>

    <header>
      <div class="brand">
        <h1>Income Wall<span class="jp">年収の壁・労働時間管理</span></h1>
        <span class="updated" id="updated"><span class="spin"></span>読み込み中</span>
      </div>
      <button class="icon-btn engine-btn" id="engine-toggle" type="button" aria-label="エンジン音の入切">■</button>

    </header>

    <main>
      <section class="view active" id="view-home"></section>
      <section class="view" id="view-income"></section>
      <section class="view" id="view-forecast"></section>
      <section class="view" id="view-reconcile"></section>
      <section class="view" id="view-settings"></section>
      <div class="disclaimer" id="disclaimer"></div>
    </main>

    <nav>
      <button data-view="home" class="active"><span class="ico">🏠</span>ホーム</button>
      <button data-view="income"><span class="ico">💴</span>収入</button>
      <button data-view="forecast"><span class="ico">📅</span>見込み</button>
      <button data-view="reconcile"><span class="ico">✅</span>照合</button>
      <button data-view="settings"><span class="ico">⚙️</span>設定</button>
    </nav>

    <div id="toast"></div>
    <div id="busy"><div>処理中…</div></div>

    <script>
      // 下のスクリプトが壊れても白い画面のまま放置しないための保険。
      // 別の script ブロックに置くことで、後続ブロックの構文エラーも拾える。
      window.addEventListener('error', function (event) {
        var updated = document.getElementById('updated');
        if (updated) updated.textContent = '表示エラー';
        var home = document.getElementById('view-home');
        if (home) {
          home.innerHTML =
            '<div class="card"><h2>画面を表示できませんでした</h2><div class="sub">' +
            String(event.message || event.error || '不明なエラー') +
            '</div><div class="sub" style="margin-top:8px">スプレッドシートのサマリータブからも同じ内容を確認できます。</div></div>';
        }
      });
    </script>

    <script>
      // JSON はそのまま JavaScript のリテラルとして正しいので、文字列に包まず埋め込む。
      // 文字列に包むと \t や \" が JS 側で先に展開されてしまい、JSON.parse が壊れる。
      var DATA = <?!= bootstrapJson ?>;

      /* ---------- 小物 ---------- */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function yen(n) {
        var v = Math.round(Number(n) || 0);
        var sign = v < 0 ? '-' : '';
        return sign + Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '円';
      }
      function pct(r) { return Math.round((Number(r) || 0) * 100) + '%'; }
      function cutoffLabel(day) {
        return Number(day) >= 31 ? '月末' : Number(day) + '日';
      }
      function payDayLabel(offset, day) {
        var when = Number(offset) === 0 ? '当月' : Number(offset) === 1 ? '翌月' : '翌々月';
        return when + (Number(day) >= 31 ? '末' : Number(day) + '日');
      }
      function monthLabel(ym) {
        var m = String(ym || '').match(/^(\d{4})-(\d{2})$/);
        return m ? Number(m[1]) + '年' + Number(m[2]) + '月' : String(ym || '');
      }
      function clamp(r) { return Math.max(0, Math.min(100, Math.round((Number(r) || 0) * 100))); }
      function el(id) { return document.getElementById(id); }

      function toast(msg) {
        var t = el('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function () { t.classList.remove('show'); }, 4200);
      }
      function busy(on) { el('busy').classList.toggle('show', on); }

      function call(fnName, arg, onDone) {
        busy(true);
        var runner = google.script.run
          .withSuccessHandler(function (res) {
            busy(false);
            if (res && res.data) DATA = res.data;
            else if (res) DATA = res;
            render();
            if (onDone) onDone(res);
            else if (res && res.message) toast(res.message);
          })
          .withFailureHandler(function (err) {
            busy(false);
            toast('エラー: ' + err.message);
          });
        if (arg === undefined) runner[fnName]();
        else runner[fnName](arg);
      }

      function bar(ratio, status) {
        return '<div class="bar"><i class="f-' + esc(status) + '" style="width:' + clamp(ratio) + '%"></i></div>';
      }
      function card(title, inner) {
        return '<div class="card">' + (title ? '<h2>' + esc(title) + '</h2>' : '') + inner + '</div>';
      }
      function row(k, v, strong) {
        return '<div class="row"><span class="k">' + esc(k) + '</span><span class="v' +
          (strong ? ' strong' : '') + '">' + v + '</span></div>';
      }
      function totalRow(k, v) {
        return '<div class="total"><div class="row"><span class="k">' + esc(k) +
          '</span><span class="v strong">' + v + '</span></div></div>';
      }
      function badge(status) {
        return '<span class="badge s-' + esc(status) + '">' + esc(status) + '</span>';
      }

      /* ---------- スピードメーター ---------- */
      /**
       * 年間収入を、バイクのスピードメーターの形で描く。
       *
       * 円のままだと画面の高さを取りすぎるので、165度から375度までの
       * 210度の弧にしている（真上が中央）。目盛りは20万円ごと、
       * 帯の色は「最初の壁まで＝緑」「次の壁まで＝橙」「その先＝赤」。
       */
      var GAUGE = { cx: 160, cy: 168, r: 128, start: 165, sweep: 210 };

      function gaugePoint(ratio, radius) {
        var a = ((GAUGE.start + GAUGE.sweep * ratio) * Math.PI) / 180;
        return [GAUGE.cx + radius * Math.cos(a), GAUGE.cy + radius * Math.sin(a)];
      }

      function gaugeArc(fromRatio, toRatio, radius) {
        var p1 = gaugePoint(fromRatio, radius);
        var p2 = gaugePoint(toRatio, radius);
        var large = GAUGE.sweep * (toRatio - fromRatio) > 180 ? 1 : 0;
        return 'M' + round1(p1[0]) + ' ' + round1(p1[1]) +
          'A' + radius + ' ' + radius + ' 0 ' + large + ' 1 ' + round1(p2[0]) + ' ' + round1(p2[1]);
      }

      function round1(n) { return Math.round(n * 10) / 10; }

      /** メーターの上限（一番大きい壁の少し先。20万円単位で切り上げ） */
      function gaugeMax(walls, revenue) {
        var top = 0;
        (walls || []).forEach(function (w) { if (w.amount > top) top = w.amount; });
        if (!top) top = 1500000;
        var needed = Math.max(top * 1.2, revenue * 1.1);
        return Math.ceil(needed / 200000) * 200000;
      }

      function speedometer(d) {
        var walls = (d.walls || []).slice().sort(function (a, b) { return a.amount - b.amount; });
        var revenue = Number(d.annual.totalRevenue) || 0;
        var max = gaugeMax(walls, revenue);
        var at = function (amount) { return Math.max(0, Math.min(1, amount / max)); };

        // 帯（緑→橙→赤）。壁の位置で色が変わる
        var firstWall = walls.length ? walls[0].amount : max;
        var lastWall = walls.length ? walls[walls.length - 1].amount : max;
        var bands =
          '<path class="g-band g-ok" d="' + gaugeArc(0, at(firstWall), GAUGE.r) + '" />' +
          (lastWall > firstWall
            ? '<path class="g-band g-warn" d="' + gaugeArc(at(firstWall), at(lastWall), GAUGE.r) + '" />'
            : '') +
          (at(lastWall) < 1
            ? '<path class="g-band g-alert" d="' + gaugeArc(at(lastWall), 1, GAUGE.r) + '" />'
            : '');

        // 目盛り。20万円ごとに数字、5万円ごとに小さい目盛り
        var ticks = '';
        var labels = '';
        for (var amount = 0; amount <= max; amount += 50000) {
          var isMajor = amount % 200000 === 0;
          var t = at(amount);
          var outer = gaugePoint(t, GAUGE.r - 8);
          var inner = gaugePoint(t, GAUGE.r - (isMajor ? 24 : 16));
          ticks +=
            '<line class="g-tick' + (isMajor ? ' g-major' : '') + '" x1="' + round1(outer[0]) + '" y1="' + round1(outer[1]) +
            '" x2="' + round1(inner[0]) + '" y2="' + round1(inner[1]) + '" />';
          if (isMajor) {
            var lp = gaugePoint(t, GAUGE.r - 43);
            labels +=
              '<text class="g-num" x="' + round1(lp[0]) + '" y="' + round1(lp[1]) + '">' +
              Math.round(amount / 10000) + '</text>';
          }
        }

        // 壁の位置に赤い印を立てる
        var marks = '';
        walls.forEach(function (w) {
          var t = at(w.amount);
          var a = gaugePoint(t, GAUGE.r + 2);
          var b = gaugePoint(t, GAUGE.r - 30);
          marks +=
            '<line class="g-wall" x1="' + round1(a[0]) + '" y1="' + round1(a[1]) +
            '" x2="' + round1(b[0]) + '" y2="' + round1(b[1]) + '" />';
        });

        // 針。0の位置で描いて回転させる（起動時に0から振れるようにするため）
        var t = at(revenue);
        var tip = gaugePoint(0, GAUGE.r - 26);
        var tail = gaugePoint(0, -14);
        var needle =
          '<g class="g-needle-wrap" style="--to:' + round1(GAUGE.sweep * t) + 'deg">' +
          '<line class="g-needle" x1="' + round1(tail[0]) + '" y1="' + round1(tail[1]) +
          '" x2="' + round1(tip[0]) + '" y2="' + round1(tip[1]) + '" />' +
          '</g>' +
          '<circle class="g-hub" cx="' + GAUGE.cx + '" cy="' + GAUGE.cy + '" r="13" />' +
          '<circle class="g-hub2" cx="' + GAUGE.cx + '" cy="' + GAUGE.cy + '" r="6" />';

        var nearest = walls.slice().sort(function (a, b) { return a.remaining - b.remaining; })[0];
        var lamp = nearest ? nearest.status : '正常';

        return (
          '<div class="gauge">' +
          '<div class="gauge-face">' +
          '<svg viewBox="0 30 320 178" role="img" aria-label="' + esc(d.targetYear + '年の収入 ' + yen(revenue)) + '">' +
          bands + ticks + marks + labels +
          '<text class="g-unit" x="' + GAUGE.cx + '" y="' + (GAUGE.cy + 30) + '">万円</text>' +
          needle +
          '</svg>' +
          '<div class="lamps">' +
          '<span class="lamp' + (lamp !== '正常' ? ' on' : '') + '"></span>' +
          '<span class="lamp' + (lamp === '警告' ? ' on alert' : '') + '"></span>' +
          '</div>' +
          '<div class="odo">' +
          '<span class="odo-k">' + d.targetYear + '</span>' +
          '<span class="odo-v">' + yen(revenue) + '</span>' +
          '</div>' +
          '</div>' +
          (nearest
            ? '<div class="gauge-note">' + esc(nearest.name) + 'まで あと <b>' +
              (nearest.remaining < 0 ? yen(-nearest.remaining) + ' 超過' : yen(nearest.remaining)) + '</b></div>'
            : '') +
          '</div>'
        );
      }

      /* ---------- ホーム ---------- */
      function renderHome() {
        var d = DATA;
        var html = '';

        html += speedometer(d);
        html += card(
          d.targetYear + '年の収入（額面）の内訳',
          '<div class="split">' +
            '<div class="chip"><div class="k">給与</div><div class="v">' + yen(d.annual.salaryRevenue) + '</div></div>' +
            '<div class="chip"><div class="k">事業</div><div class="v">' + yen(d.annual.businessRevenue) + '</div></div>' +
            '<div class="chip"><div class="k">雑</div><div class="v">' + yen(d.annual.miscRevenue) + '</div></div>' +
            '</div>'
        );

        var wallsHtml = '';
        (d.walls || []).forEach(function (w) {
          var over = w.remaining < 0;
          wallsHtml +=
            '<div class="wall">' +
            '<div class="head"><span class="name">' + esc(w.name) + '</span>' + badge(w.status) + '</div>' +
            '<div class="rest' + (over ? ' neg' : '') + '">' +
            (over ? '超過 ' : '') + yen(Math.abs(w.remaining)) + '</div>' +
            bar(w.ratio, w.status) +
            '<div class="meta"><span class="sub">' + yen(w.amount) + ' のうち ' + pct(w.ratio) + '</span>' +
            '<span class="sub">更新 ' + esc(w.lastUpdated) + '</span></div>' +
            (w.note ? '<div class="sub" style="margin-top:7px">' + esc(w.note) + '</div>' : '') +
            '</div>';
        });
        html += card('壁までの残り', wallsHtml || '<div class="empty">壁が登録されていません</div>');

        var hoursHtml = '';
        if (!(d.hours || []).length) {
          hoursHtml = '<div class="empty">今月の勤務データはまだありません</div>';
        } else {
          d.hours.forEach(function (h, i) {
            hoursHtml +=
              '<div class="' + (i ? 'block' : '') + '">' +
              '<div class="head" style="display:flex;justify-content:space-between;align-items:center">' +
              '<h3>' + esc(h.companyName) + '</h3>' + badge(h.status) + '</div>' +
              bar(h.ratio, h.status) +
              '<div class="row"><span class="sub">' + h.hours + ' / ' + h.limit + ' 時間（' + pct(h.ratio) + '）' +
              (h.confirmed ? '' : ' ・暫定') + '</span>' +
              '<span class="sub">' + h.days + '日 ' + yen(h.amount) + '</span></div>' +
              '</div>';
          });
        }
        html += card('今月（' + esc(d.yearMonth) + '）の労働時間', hoursHtml);

        var weekly = (d.weekly || []).filter(function (w) { return w.isCurrentWeek; });
        if (weekly.length) {
          var weeklyHtml = '';
          weekly.forEach(function (w, i) {
            weeklyHtml +=
              '<div class="' + (i ? 'block' : '') + '">' +
              '<div class="head" style="display:flex;justify-content:space-between;align-items:center">' +
              '<h3>' + esc(w.companyName) + '</h3>' + badge(w.status) + '</div>' +
              bar(w.ratio, w.status) +
              '<div class="row"><span class="sub">' + w.hours + ' / ' + w.limit + ' 時間</span>' +
              '<span class="sub">残り ' + w.remainingHours + 'h</span></div></div>';
          });
          html += card('今週（' + esc(weekly[0].weekStart) + ' 〜 ' + esc(weekly[0].weekEnd) + '）', weeklyHtml);
        }

        var consecutive = (d.consecutive || []).filter(function (c) { return c.requiredMonths >= 2; });
        if (consecutive.length) {
          var conHtml = '';
          consecutive.forEach(function (c, i) {
            conHtml +=
              '<div class="' + (i ? 'block' : '') + '">' +
              '<div class="head" style="display:flex;justify-content:space-between;align-items:center">' +
              '<h3>' + esc(c.companyName) + '</h3>' + badge(c.status) + '</div>' +
              '<div class="sub" style="margin-top:6px">月' + c.limit + '時間以上が' + c.requiredMonths + 'ヶ月連続で対象</div>' +
              '<div class="sub" style="margin-top:3px">' + c.months.map(function (m) {
                return esc(m.yearMonth) + ' <b>' + m.hours + 'h</b>' + (m.over ? '（超）' : '');
              }).join('　/　') + '</div>' +
              (c.message ? '<div class="sub" style="margin-top:7px">' + esc(c.message) + '</div>' : '') +
              '</div>';
          });
          html += card('連続月の判定', conHtml);
        }

        var listHtml = '';
        if (!(d.recentEntries || []).length) {
          listHtml = '<div class="empty">まだ取り込まれた勤務がありません</div>';
        } else {
          listHtml = '<ul class="list">';
          d.recentEntries.forEach(function (e) {
            listHtml +=
              '<li><div class="row"><span><b>' + esc(e.date.slice(5)) + '</b>　' + esc(e.companyName) +
              (e.reconciled ? ' <span class="badge s-OK">照合済</span>' : '') + '</span>' +
              '<span class="v strong">' + yen(e.amount) + '</span></div>' +
              '<div class="sub">' + esc(e.startTime) + '-' + esc(e.endTime) + '　' + e.workedHours + '時間' +
              (e.allowance ? '　手当 ' + yen(e.allowance) : '') +
              (e.fixedAmount ? '　<span class="badge s-INFO">支給額</span>' : '') + '</div></li>';
          });
          listHtml += '</ul>';
        }
        html += card('直近の勤務', listHtml);

        el('view-home').innerHTML = html;
      }

      /* ---------- 収入 ---------- */
      /** 支給日ごとの振込予定。会社ごとに締め日と支給日が違うのでここでまとめて見せる */
      function paymentsHtml() {
        var list = DATA.payments || [];
        if (!list.length) return '<div class="empty">まだ振込予定がありません</div>';

        // 同じ支給日に複数社から振り込まれることがあるので、日付でまとめる
        var byDate = {};
        var order = [];
        list.forEach(function (p) {
          if (!byDate[p.payDate]) { byDate[p.payDate] = []; order.push(p.payDate); }
          byDate[p.payDate].push(p);
        });
        order.sort();

        var html = '';
        order.forEach(function (date, i) {
          var group = byDate[date];
          var total = 0;
          var paid = true;
          group.forEach(function (p) { total += p.amount; if (!p.isPaid) paid = false; });

          html +=
            '<div class="' + (i ? 'block' : '') + '">' +
            '<div class="row"><span><b>' + esc(formatPayDate(date)) + '</b>' +
            (paid ? ' <span class="badge s-OK">入金済</span>' : ' <span class="badge s-INFO">予定</span>') +
            '</span><span class="v strong">' + yen(total) + '</span></div>';

          group.forEach(function (p) {
            html +=
              '<div class="sub" style="margin-top:4px">' + esc(p.companyName) + '　' +
              esc(shortRange(p.periodFrom, p.periodTo)) + ' の分　' +
              p.days + '日 / ' + p.hours + '時間　' + yen(p.amount) +
              (p.confirmed ? '' : '　<span class="badge s-注意">サイクル暫定</span>') +
              (p.moved ? '<br />　本来は ' + esc(formatPayDate(p.scheduledDate)) + '（休日のため前後にずれています）' : '') +
              '</div>';
          });
          html += '</div>';
        });
        return html;
      }

      function formatPayDate(dateStr) {
        var m = String(dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return String(dateStr || '');
        var week = ['日', '月', '火', '水', '木', '金', '土'];
        var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        return Number(m[2]) + '月' + Number(m[3]) + '日（' + week[d.getDay()] + '）';
      }

      function shortRange(from, to) {
        return String(from || '').slice(5).replace('-', '/') + '〜' + String(to || '').slice(5).replace('-', '/');
      }

      function renderIncome() {
        var a = DATA.annual;

      /* ---------- 起動画面とエンジン音 ---------- */
      // ブラウザは利用者が操作するまで音を鳴らせない決まりなので、
      // スタートボタンを押した流れの中で再生を始める。
      var SOUND_KEY = 'engineSound';
      var IDLE_LOOP_SECONDS = Number('<?!= idleLoopSeconds ?>') || 1.65;

      function soundEnabled() {
        try { return localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { return true; }
      }
      function setSoundEnabled(on) {
        try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) { /* 保存できなくても動く */ }
      }

      /**
       * エンジン音の再生。
       *
       * アイドリング音は開いている間ずっと繰り返すが、mp3 は符号化の都合で
       * 前後に無音が入るため <audio loop> だと1回転ごとに途切れる。
       * Web Audio API で読み込み、無音を除いた区間だけを繰り返すことで
       * 継ぎ目を無くしている。Web Audio が使えない場合は <audio loop> に戻す。
       */
      var Engine = (function () {
        var ctx = null;
        var idleSource = null;
        var idleGain = null;
        var idleBuffer = null;
        var running = false;
        var startEl = el('engine');
        var idleEl = el('idle');

        function audioContext() {
          if (ctx) return ctx;
          var Ctor = window.AudioContext || window.webkitAudioContext;
          if (!Ctor) return null;
          try { ctx = new Ctor(); } catch (e) { ctx = null; }
          return ctx;
        }

        function decodeIdle() {
          // 2回目以降は読み込み済みのものを返す（null を返すと繰り返しが途切れる方に落ちる）
          if (idleBuffer) return Promise.resolve(idleBuffer);
          var context = audioContext();
          if (!context || !idleEl) return Promise.resolve(null);
          var src = idleEl.getAttribute('src') || '';
          var base64 = src.slice(src.indexOf(',') + 1);
          var binary;
          try { binary = atob(base64); } catch (e) { return Promise.resolve(null); }
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          return new Promise(function (resolve) {
            var done = function (buffer) { idleBuffer = buffer; resolve(buffer); };
            var fail = function () { resolve(null); };
            try {
              var ret = context.decodeAudioData(bytes.buffer, done, fail);
              if (ret && ret.then) ret.then(done, fail);
            } catch (e) { fail(); }
          });
        }

        /** mp3 の先頭に無音が残っている場合があるので、音が始まる位置を探す */
        function firstSoundAt(buffer) {
          var data = buffer.getChannelData(0);
          var limit = Math.min(data.length, Math.floor(buffer.sampleRate * 0.2));
          for (var i = 0; i < limit; i++) {
            if (Math.abs(data[i]) > 0.003) return i / buffer.sampleRate;
          }
          return 0;
        }

        function startIdleWebAudio(buffer, at) {
          var context = audioContext();
          if (!context || !buffer) return false;
          var from = firstSoundAt(buffer);
          var source = context.createBufferSource();
          source.buffer = buffer;
          source.loop = true;
          source.loopStart = from;
          source.loopEnd = Math.min(buffer.duration, from + IDLE_LOOP_SECONDS);

          var gain = context.createGain();
          gain.gain.setValueAtTime(0, at);
          gain.gain.linearRampToValueAtTime(0.32, at + 0.5);
          source.connect(gain);
          gain.connect(context.destination);
          source.start(at, from);

          idleSource = source;
          idleGain = gain;
          return true;
        }

        function startIdleFallback() {
          if (!idleEl) return;
          try {
            idleEl.volume = 0.32;
            idleEl.currentTime = 0;
            var p = idleEl.play();
            if (p && p.catch) p.catch(function () {});
          } catch (e) { /* 鳴らせなくても画面は動く */ }
        }

        function stopIdle() {
          var context = ctx;
          if (idleSource && context) {
            try {
              var now = context.currentTime;
              idleGain.gain.cancelScheduledValues(now);
              idleGain.gain.setValueAtTime(idleGain.gain.value, now);
              idleGain.gain.linearRampToValueAtTime(0, now + 0.25);
              idleSource.stop(now + 0.3);
            } catch (e) { /* すでに止まっていることがある */ }
          }
          idleSource = null;
          idleGain = null;
          if (idleEl) { try { idleEl.pause(); } catch (e) { /* 無視 */ } }
        }

        return {
          get running() { return running; },

          /** スタートボタンから呼ぶ。始動音を鳴らし、続けてアイドリングに移る */
          start: function () {
            if (!soundEnabled()) return 0;
            running = true;
            var context = audioContext();
            if (context && context.state === 'suspended') {
              try { context.resume(); } catch (e) { /* 無視 */ }
            }

            var startedAt = Date.now();
            var duration = 4.3;
            if (startEl) {
              try {
                startEl.currentTime = 0;
                var p = startEl.play();
                if (p && p.catch) p.catch(function () {});
                if (startEl.duration) duration = startEl.duration;
              } catch (e) { /* 鳴らせなくても進む */ }
            }

            // 始動音の終わり際にアイドリングを重ねる（途切れて聞こえないように）
            var overlap = 0.6;
            decodeIdle().then(function (buffer) {
              if (!running) return;
              var elapsed = (Date.now() - startedAt) / 1000;
              var wait = Math.max(0, duration - overlap - elapsed);
              if (buffer && context) {
                startIdleWebAudio(buffer, context.currentTime + wait);
              } else {
                setTimeout(function () { if (running) startIdleFallback(); }, wait * 1000);
              }
            });
            return duration;
          },

          stop: function () {
            running = false;
            stopIdle();
            if (startEl) { try { startEl.pause(); } catch (e) { /* 無視 */ } }
          },

          /** 画面を離れたときは黙らせ、戻ってきたら鳴らし直す */
          pause: function () {
            if (!running) return;
            stopIdle();
          },
          resume: function () {
            if (!running || idleSource || !soundEnabled()) return;
            var context = audioContext();
            decodeIdle().then(function (buffer) {
              if (!running) return;
              if (buffer && context) startIdleWebAudio(buffer, context.currentTime);
              else startIdleFallback();
            });
          }
        };
      })();

      function paintEngineButton() {
        var btn = el('engine-toggle');
        if (!btn) return;
        var on = soundEnabled();
        btn.textContent = on ? '🏍 ON' : '🏍 OFF';
        btn.classList.toggle('off', !on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      }

      function enterApp() {
        var ignition = el('ignition');
        if (!ignition || ignition.classList.contains('gone')) return;
        ignition.classList.add('gone');
        setTimeout(function () { ignition.style.display = 'none'; }, 600);
      }

      (function setupIgnition() {
        var starter = el('starter');
        var muteBtn = el('mute-toggle');
        if (!starter) return;

        function paintMute() {
          muteBtn.textContent = soundEnabled() ? '音を消す' : '音を出す';
        }
        paintMute();
        paintEngineButton();

        muteBtn.addEventListener('click', function (event) {
          event.stopPropagation();
          setSoundEnabled(!soundEnabled());
          paintMute();
          paintEngineButton();
        });

        starter.addEventListener('click', function () {
          starter.classList.add('cranking');
          Engine.start();
          // エンジンがかかりだしてから画面に入ると気持ちがよい
          var wait = soundEnabled() ? 900 : 320;
          setTimeout(function () {
            starter.classList.remove('cranking');
            enterApp();
          }, wait);
        });

        var engineBtn = el('engine-toggle');
        if (engineBtn) {
          engineBtn.addEventListener('click', function () {
            var on = !soundEnabled();
            setSoundEnabled(on);
            paintEngineButton();
            paintMute();
            if (on) {
              // 押した操作の中なので、ここから鳴らし始められる
              if (Engine.running) Engine.resume();
              else Engine.start();
            } else {
              Engine.stop();
            }
          });
        }

        // 他のアプリに切り替えている間は黙らせる
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) Engine.pause();
          else Engine.resume();
        });
      })();

      render();
      // 画面を出したあとにカレンダーを読む。ここを待つと表示が遅くなるため。
      // 起動画面を見ている間に裏で終わるので、体感では待ち時間が消える。
      if (DATA.needsSync) syncCalendar(false);
    </script>
  </body>
</html>
